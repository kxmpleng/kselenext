name: build-kernel
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio zip lz4 python3 git \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          clang-14 --version
      - name: strip Werror
        run: |
          find . \( -name Makefile -o -name 'Makefile.*' -o -name Kbuild -o -name '*.mk' \) \
            -not -path './Makefile' -not -path './scripts/*' -print0 \
            | xargs -0 grep -l -- '-Werror' | xargs -r sed -i -E 's/ ?-Werror(=[a-zA-Z0-9_-]+)?//g'
      - name: build
        run: |
          make O=out ARCH=arm64 selene_defconfig
          grep -E "CONFIG_KSU|SUSFS" out/.config || true
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang-14 LD=ld.lld-14 AR=llvm-ar-14 NM=llvm-nm-14 \
            OBJCOPY=llvm-objcopy-14 OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14 \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-Wno-error" \
            Image.gz-dtb 2>&1 | tee build.log || { echo "=== ERROR PERTAMA ==="; grep -n -E "error:|\*\*\*|No such file" build.log | head -15; exit 1; }
      - name: package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          cp out/arch/arm64/boot/Image.gz-dtb ak3/
          cd ak3
          sed -i 's/^kernel.string=.*/kernel.string=KSUN selene/; s/^device.name1=.*/device.name1=selene/; s/^block=.*/block=boot;/; s/^is_slot_device=.*/is_slot_device=0;/' anykernel.sh
          zip -r9 ../KSUN-selene.zip * -x .git README.md '*placeholder'
      - uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: |
            KSUN-selene.zip
            out/arch/arm64/boot/Image.gz-dtb